[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-os"
version = "0.1.0"
description = "Job ingestion, normalization, and scoring for Tyrone Nelms' remote career search."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
career-os = "career_os.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
